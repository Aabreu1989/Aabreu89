<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIRA - Diagnóstico Google Login</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #020420; color: white; min-height: 100vh;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px; padding: 32px; max-width: 500px; width: 100%;
}
h1 { color: #FF8C00; font-size: 22px; margin-bottom: 8px; }
p { color: rgba(255,255,255,0.6); font-size: 14px; margin-bottom: 24px; }
button {
  width: 100%; padding: 14px; border: none; border-radius: 12px;
  font-weight: 700; font-size: 14px; cursor: pointer; margin-bottom: 12px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.btn-google { background: white; color: #111; }
.btn-clear { background: rgba(255,255,255,0.1); color: white; font-size: 12px; }
.result {
  margin-top: 20px; padding: 16px; border-radius: 12px;
  font-family: monospace; font-size: 12px; line-height: 1.8;
  white-space: pre-wrap; word-break: break-all;
}
.ok { background: rgba(0,200,100,0.15); border: 1px solid rgba(0,200,100,0.4); color: #4dffaa; }
.error { background: rgba(255,50,50,0.15); border: 1px solid rgba(255,50,50,0.4); color: #ff8888; }
.info { background: rgba(100,150,255,0.15); border: 1px solid rgba(100,150,255,0.4); color: #aaccff; }
.step { color: rgba(255,255,255,0.4); font-size: 11px; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="card">
  <h1>🔍 Diagnóstico Google Login</h1>
  <p>Esta página testa o Google Login e mostra o erro exacto no ecrã.</p>
  
  <button class="btn-google" onclick="testGoogleLogin()">
    <img src="https://www.google.com/favicon.ico" width="18"> 
    Testar Google Login
  </button>
  <button class="btn-clear" onclick="clearAndReload()">🗑️ Limpar dados e recarregar</button>
  
  <div id="result"></div>
</div>

<script>
// Inline Supabase client (sem módulos, funciona directamente)
const SUPABASE_URL = 'https://zqoxqkyfzaywsgngiydx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpxb3hxa3lmemF5d3NnbmdpeWR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5OTczNjgsImV4cCI6MjEwMDU3MzM2OH0.SSlZnnSiLapnkRd3ZlC-uRjtFB7LGBm-G4ajF6hri08';

function show(msg, type = 'info') {
  const el = document.getElementById('result');
  el.className = 'result ' + type;
  el.textContent = msg;
}

function showMulti(lines, type = 'info') {
  show(lines.join('\n'), type);
}

function clearAndReload() {
  // Remove todas as chaves do Supabase e MIRA do localStorage
  const keysToRemove = Object.keys(localStorage).filter(k => 
    k.includes('supabase') || k.includes('mira') || k.includes('sb-')
  );
  keysToRemove.forEach(k => localStorage.removeItem(k));
  sessionStorage.clear();
  show('✅ Limpeza feita. A recarregar...', 'ok');
  setTimeout(() => location.reload(), 800);
}

// ─── Ao carregar: verificar se há código na URL ───────────────────────
window.addEventListener('load', async () => {
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const errorParam = params.get('error');
  const errorDesc = params.get('error_description');

  if (errorParam) {
    showMulti([
      '❌ ERRO DO GOOGLE/SUPABASE NA REDIRECT:',
      '',
      'error: ' + errorParam,
      'description: ' + (errorDesc || 'sem descrição'),
      '',
      '→ Isto significa que o Google ou o Supabase rejeitou o pedido.',
      '→ Verifique o Client ID e Client Secret no Supabase Dashboard.',
    ], 'error');
    history.replaceState({}, '', '/diag.html');
    return;
  }

  if (!code) {
    showMulti([
      'ℹ️ Pronto para testar.',
      '',
      'Clique "Testar Google Login" acima.',
      'Depois de voltar do Google, esta página mostra o resultado.',
      '',
      '── Estado actual do localStorage ──',
      'code-verifier: ' + (localStorage.getItem('mira-token-v4-code-verifier') ? '✅ PRESENTE' : '❌ AUSENTE'),
      'session: ' + (localStorage.getItem('mira-token-v4') ? '✅ PRESENTE' : '❌ AUSENTE'),
    ], 'info');
    return;
  }

  // Temos um código! Tentar exchange
  show('🔄 Código OAuth recebido. A fazer exchange...', 'info');
  history.replaceState({}, '', '/diag.html'); // Limpar URL

  try {
    // Usar fetch directamente para fazer o exchange PKCE
    const verifier = localStorage.getItem('mira-token-v4-code-verifier') || 
                     localStorage.getItem('supabase.auth.pkce.code_verifier') ||
                     findVerifierInStorage();

    if (!verifier) {
      showMulti([
        '❌ CODE VERIFIER NÃO ENCONTRADO no localStorage!',
        '',
        'Chaves no localStorage:',
        ...Object.keys(localStorage).filter(k => k.includes('mira') || k.includes('supabase') || k.includes('sb-')).map(k => '  • ' + k),
        '',
        '→ CAUSA: O code verifier gerado antes do redirect ao Google foi perdido.',
        '→ Pode ter sido limpo por outro script, ou o redirect foi para uma URL diferente.',
        '→ Tente clicar "Limpar dados e recarregar" e tente de novo.',
      ], 'error');
      return;
    }

    showMulti([
      '✅ Code verifier encontrado: ' + verifier.substring(0, 20) + '...',
      '🔄 A fazer exchange com o Supabase...',
    ], 'info');

    // Exchange manual via fetch
    const response = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=pkce', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({
        auth_code: code,
        code_verifier: verifier,
        redirect_uri: location.origin + '/diag.html',
      })
    });

    const result = await response.json();

    if (!response.ok || result.error) {
      showMulti([
        '❌ EXCHANGE FALHOU:',
        '',
        'Status HTTP: ' + response.status,
        'Erro: ' + (result.error || 'desconhecido'),
        'Mensagem: ' + (result.error_description || result.msg || 'sem mensagem'),
        '',
        '→ Se "flow state not found": o verifier não corresponde ao código.',
        '→ Se "invalid grant": o código já foi usado ou expirou.',
        '→ Se outro erro: verifique as credenciais do Google no Supabase.',
      ], 'error');
    } else {
      showMulti([
        '✅ GOOGLE LOGIN FUNCIONOU!',
        '',
        'Email: ' + (result.user?.email || 'não disponível'),
        'Provider: ' + (result.user?.app_metadata?.provider || 'google'),
        'ID: ' + (result.user?.id || 'não disponível'),
        '',
        '→ O problema está na app React, não no OAuth.',
        '→ O exchange funciona correctamente.',
        '',
        'Agora clique aqui para ir à app: http://localhost:3333',
      ], 'ok');
    }
  } catch (e) {
    showMulti([
      '❌ EXCEPÇÃO DURANTE EXCHANGE:',
      '',
      e.message,
      '',
      'Stack: ' + (e.stack || 'não disponível'),
    ], 'error');
  }
});

function findVerifierInStorage() {
  // Tentar todos os formatos possíveis de chave do verifier
  const patterns = [
    'mira-token-v4-code-verifier',
    'supabase.auth.pkce.code_verifier',
    'pkce_code_verifier',
  ];
  for (const p of patterns) {
    const val = localStorage.getItem(p);
    if (val) return val;
  }
  // Tentar padrões sb- do Supabase
  for (const key of Object.keys(localStorage)) {
    if (key.includes('code-verifier') || key.includes('code_verifier')) {
      return localStorage.getItem(key);
    }
  }
  return null;
}

async function testGoogleLogin() {
  show('🔄 A gerar URL do Google OAuth...', 'info');
  
  // Gerar PKCE manualmente
  const verifier = generateCodeVerifier();
  const challenge = await generateCodeChallenge(verifier);
  
  // Guardar verifier COM TODOS OS FORMATOS possíveis para não perder
  localStorage.setItem('mira-token-v4-code-verifier', verifier);
  localStorage.setItem('supabase.auth.pkce.code_verifier', verifier);
  localStorage.setItem('pkce_code_verifier', verifier);
  
  const redirectUri = location.origin + '/diag.html';
  const state = crypto.getRandomValues(new Uint8Array(16)).reduce((a, b) => a + b.toString(16).padStart(2, '0'), '');
  
  // Construir URL do Supabase OAuth
  const oauthUrl = new URL(SUPABASE_URL + '/auth/v1/authorize');
  oauthUrl.searchParams.set('provider', 'google');
  oauthUrl.searchParams.set('redirect_to', redirectUri);
  oauthUrl.searchParams.set('code_challenge', challenge);
  oauthUrl.searchParams.set('code_challenge_method', 'S256');
  oauthUrl.searchParams.set('response_type', 'code');

  showMulti([
    '✅ PKCE gerado com sucesso!',
    '',
    'Code Verifier: ' + verifier.substring(0, 30) + '... (guardado)',
    'Code Challenge: ' + challenge.substring(0, 30) + '...',
    'Redirect URI: ' + redirectUri,
    '',
    '→ A redirecionar para o Google em 2 segundos...',
    '→ Verifier guardado em 3 chaves do localStorage.',
  ], 'ok');
  
  setTimeout(() => { location.href = oauthUrl.toString(); }, 2000);
}

// PKCE helpers
function generateCodeVerifier() {
  const array = new Uint8Array(32);
  crypto.getRandomValues(array);
  return btoa(String.fromCharCode(...array))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
}

async function generateCodeChallenge(verifier) {
  const encoder = new TextEncoder();
  const data = encoder.encode(verifier);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return btoa(String.fromCharCode(...new Uint8Array(digest)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
}
</script>
</body>
</html>
