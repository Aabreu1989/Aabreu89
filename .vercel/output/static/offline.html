<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIRA - Offline</title>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            background: white;
            padding: 40px;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            border: 1px solid #f1f5f9;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        h1 {
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin: 0 0 10px 0;
            font-size: 24px;
        }
        p {
            font-size: 14px;
            line-height: 1.6;
            color: #64748b;
            margin-bottom: 30px;
        }
        .btn {
            background: #0f172a;
            color: white;
            padding: 16px 32px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
            display: inline-block;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .emergency {
            margin-top: 40px;
            background: #fff1f2;
            padding: 15px;
            border-radius: 20px;
            border: 1px solid #fecaca;
        }
        .emergency p {
            color: #b91c1c;
            margin-bottom: 0;
            font-weight: 800;
            font-size: 11px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>Sem Ligação</h1>
        <p>Parece que está offline. Não se preocupe, o MIRA guardou os dados de emergência para si.</p>
        <a href="/" class="btn">Tentar Novamente</a>
        
        <div class="emergency">
            <p>Emergência Médica: 112</p>
            <p>SNS 24: 808 24 24 24</p>
        </div>
    </div>
    <script>
        // Auto-refresh when online
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
