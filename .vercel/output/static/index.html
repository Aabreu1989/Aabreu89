      }

      75% {
        filter: drop-shadow(0 0 10px #f97316);
        opacity: 0.95;
      }

    .animate-mira-blink {

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    body {

    .is-typing .hide-on-typing {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: translateY(100px) !important;
    }

    .is-typing header {
      transform: translateY(-100%) !important;
    }

    .is-typing nav {
      transform: translateY(100%) !important;
    }

    /* V26.15: Mira 4-color pulsing lights - Centralized as requested */
    @keyframes mira-lights {
      0%, 100% { box-shadow: 0 0 30px #FF8C00, 0 0 60px #FF8C00; filter: brightness(1.2); }
      25% { box-shadow: 0 0 30px #0066FF, 0 0 60px #0066FF; filter: brightness(1.2); }
      50% { box-shadow: 0 0 30px #22c55e, 0 0 60px #22c55e; filter: brightness(1.2); }
      75% { box-shadow: 0 0 30px #facc15, 0 0 60px #facc15; filter: brightness(1.2); }
    }
    .mira-lights-glow {
      animation: mira-lights 4s infinite linear;
      border-radius: 9999px;
    }

    /* V26.15: Rainbow scanning bar for login/top elements */
    @keyframes rainbow-scan {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    .rainbow-bar {
      height: 4px;
      width: 100%;
      background: linear-gradient(90deg, #FF8C00, #0066FF, #22c55e, #facc15, #FF8C00);
      background-size: 200% 100%;
      animation: rainbow-scan 3s infinite linear;
      border-radius: 2px;
    }

      text-transform: uppercase;
