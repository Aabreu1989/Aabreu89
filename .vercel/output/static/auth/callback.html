<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Confirmado — MIRA Imigrante</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: linear-gradient(135deg, #0a162b 0%, #003b75 60%, #1e3a5f 100%);
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    .card {
      background: #ffffff;
      border-radius: 32px;
      padding: 56px 48px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 40px 80px rgba(0,0,0,0.30);
      animation: slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      opacity: 0;
      transform: translateY(40px);
    }

    @keyframes slideUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .check-circle {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      box-shadow: 0 16px 32px rgba(16, 185, 129, 0.35);
      animation: popIn 0.5s 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes popIn {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .check-circle svg {
      width: 38px;
      height: 38px;
      stroke: #ffffff;
      stroke-width: 3;
      fill: none;
    }

    .logo {
      font-size: 13px;
      font-weight: 900;
      color: #f97316;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 28px;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: -0.5px;
      margin-bottom: 14px;
    }

    p {
      font-size: 15px;
      color: #64748b;
      line-height: 1.7;
      font-weight: 600;
      margin-bottom: 36px;
    }

    .btn {
      display: inline-block;
      background: #f97316;
      color: #ffffff;
      padding: 18px 42px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow: 0 12px 28px rgba(249, 115, 22, 0.35);
      transition: all 0.2s;
    }

    .btn:hover { background: #ea6500; transform: translateY(-2px); box-shadow: 0 18px 36px rgba(249, 115, 22, 0.4); }
    .btn:active { transform: translateY(0); }

    .timer-bar {
      height: 3px;
      background: #e2e8f0;
      border-radius: 99px;
      overflow: hidden;
      margin-top: 32px;
    }

    .timer-fill {
      height: 100%;
      background: linear-gradient(90deg, #f97316, #fb923c);
      border-radius: 99px;
      animation: countdown 5s linear forwards;
    }

    @keyframes countdown {
      from { width: 100%; }
      to { width: 0%; }
    }

    .hint {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 12px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">MIRA Imigrante</div>

    <div class="check-circle">
      <svg viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>

    <h1>Email Confirmado! 🎉</h1>
    <p>
      A tua conta MIRA está ativa.<br/>
      Bem-vindo à comunidade! Estamos aqui para caminhar ao teu lado em Portugal.
    </p>

    <a href="/" class="btn">Entrar na MIRA →</a>

    <div class="timer-bar">
      <div class="timer-fill"></div>
    </div>
    <p class="hint">Redireccionando automaticamente em 5 segundos...</p>
  </div>

  <script>
    // Parse the Supabase hash and pass it to the root so Auth can pick it up
    const hash = window.location.hash;
    const search = window.location.search;

    // Auto redirect after 5s, passing auth tokens to the app
    setTimeout(() => {
      window.location.href = '/' + hash + search;
    }, 5000);
  </script>
</body>
</html>
