<!DOCTYPE html>
<html>
<head>
<title>MIRA - OAuth Debug</title>
<style>
body { font-family: monospace; background: #0a0a0a; color: #00ff00; padding: 20px; }
button { background: #FF8C00; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 14px; margin: 8px; }
pre { background: #111; padding: 16px; border-radius: 8px; border: 1px solid #333; overflow-wrap: break-word; white-space: pre-wrap; }
.error { color: #ff4444; }
.success { color: #00ff00; }
.info { color: #4488ff; }
</style>
</head>
<body>
<h2>🔍 MIRA OAuth Diagnostics</h2>
<pre id="log">A aguardar...</pre>
<button onclick="testGoogle()">🔑 Testar Google Login</button>
<button onclick="checkSession()">📋 Ver Sessão Actual</button>
<button onclick="clearAll()">🗑️ Limpar Tudo</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const log = (msg, type = 'info') => {
  const el = document.getElementById('log');
  const ts = new Date().toISOString().substr(11,8);
  el.innerHTML += `\n[${ts}] <span class="${type}">${msg}</span>`;
  console.log(msg);
};

const SUPABASE_URL = 'https://zqoxqkyfzaywsgngiydx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpxb3hxa3lmemF5d3NnbmdpeWR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5OTczNjgsImV4cCI6MjEwMDU3MzM2OH0.SSlZnnSiLapnkRd3ZlC-uRjtFB7LGBm-G4ajF6hri08';

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    flowType: 'pkce',
    detectSessionInUrl: true,
    persistSession: true,
    storageKey: 'mira-debug-session'
  }
});

// Check URL on load
window.addEventListener('load', async () => {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const error = params.get('error');
  const errorDesc = params.get('error_description');
  
  log('=== DIAGNÓSTICO DE URL ===');
  log(`URL completo: ${window.location.href}`);
  log(`Código OAuth: ${code ? code.substring(0,20)+'...' : 'NENHUM'}`);
  
  if (error) {
    log(`❌ ERRO NO REDIRECT: ${error}`, 'error');
    log(`Descrição: ${errorDesc}`, 'error');
    return;
  }
  
  if (code) {
    log('✅ Código OAuth recebido! A processar...', 'success');
    try {
      // Wait for SDK to auto-process
      await new Promise(r => setTimeout(r, 1000));
      const { data: { session }, error: sessErr } = await client.auth.getSession();
      if (session) {
        log(`✅ SESSÃO CRIADA! Utilizador: ${session.user.email}`, 'success');
        log(`Provider: ${session.user.app_metadata.provider}`, 'success');
      } else if (sessErr) {
        log(`❌ Erro na sessão: ${sessErr.message}`, 'error');
        // Try manual exchange
        log('A tentar exchangeCodeForSession manual...', 'info');
        const { data, error: exchErr } = await client.auth.exchangeCodeForSession(code);
        if (data?.session) {
          log(`✅ Exchange manual funcionou! Email: ${data.session.user.email}`, 'success');
        } else {
          log(`❌ Exchange manual falhou: ${exchErr?.message}`, 'error');
        }
      } else {
        log('⚠️ Sessão vazia após código. Tentando exchange...', 'error');
        const { data, error: exchErr } = await client.auth.exchangeCodeForSession(code);
        if (data?.session) {
          log(`✅ Exchange funcionou! Email: ${data.session.user.email}`, 'success');
        } else {
          log(`❌ Exchange falhou: ${exchErr?.message}`, 'error');
          log(`Erro completo: ${JSON.stringify(exchErr)}`, 'error');
        }
      }
    } catch(e) {
      log(`❌ Excepção: ${e.message}`, 'error');
    }
  } else {
    log('ℹ️ Sem código OAuth na URL. Pronto para testar.', 'info');
    await checkSessionSilent();
  }
});

async function checkSessionSilent() {
  const { data: { session } } = await client.auth.getSession();
  if (session) {
    log(`✅ Sessão activa: ${session.user.email}`, 'success');
  } else {
    log('ℹ️ Sem sessão activa.', 'info');
  }
}

async function testGoogle() {
  log('A iniciar Google OAuth...', 'info');
  const redirectTo = window.location.origin + '/oauth-test.html';
  log(`Redirect URL: ${redirectTo}`, 'info');
  const { data, error } = await client.auth.signInWithOAuth({
    provider: 'google',
    options: { 
      redirectTo,
      queryParams: { access_type: 'offline', prompt: 'consent' }
    }
  });
  if (error) {
    log(`❌ Erro: ${error.message}`, 'error');
  } else {
    log(`A redirecionar para: ${data?.url?.substring(0,80)}...`, 'info');
  }
}

async function checkSession() {
  log('=== SESSÃO ACTUAL ===', 'info');
  const { data: { session }, error } = await client.auth.getSession();
  if (error) {
    log(`❌ Erro: ${error.message}`, 'error');
  } else if (session) {
    log(`✅ Email: ${session.user.email}`, 'success');
    log(`✅ Provider: ${session.user.app_metadata.provider}`, 'success');
    log(`✅ ID: ${session.user.id}`, 'success');
  } else {
    log('ℹ️ Sem sessão', 'info');
  }
}

function clearAll() {
  Object.keys(localStorage).filter(k => k.includes('mira') || k.includes('supabase')).forEach(k => {
    localStorage.removeItem(k);
    log(`Removido: ${k}`);
  });
  log('✅ Limpeza completa!', 'success');
}
</script>
</body>
</html>
