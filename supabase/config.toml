
[functions.emergency-db-fix]
enabled = true
verify_jwt = true
import_map = "./functions/emergency-db-fix/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/emergency-db-fix/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/emergency-db-fix/*.html" ]

[functions.gemini-assistant]
enabled = true
verify_jwt = false
import_map = "./functions/gemini-assistant/deno.json"
entrypoint = "./functions/gemini-assistant/index.ts"

